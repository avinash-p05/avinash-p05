<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif">
  <defs>
    <style>
      .card  { opacity: 0; animation: in .6s ease forwards; }
      .big   { font-size: 34px; font-weight: 800; }
      .lbl   { font-size: 14px; fill: #c9d1d9; }
      .sub   { font-size: 12px; fill: #8b949e; font-family: 'Cascadia Code', Consolas, monospace; }
      .bar   { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1.4s ease forwards; }
      .title { font-size: 13px; fill: #8b949e; letter-spacing: 3px; font-weight: 600; }
      @keyframes in   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { to { transform: scaleX(1); } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="249" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text class="title" x="30" y="36">IMPACT · BY THE NUMBERS</text>

  <!-- row of 3 cards x 2 rows -->
  <g class="card" style="animation-delay:.1s">
    <rect x="30" y="54" width="300" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
    <text class="big" x="50" y="96" fill="#f89820">1,000+/s</text>
    <text class="lbl" x="50" y="120">payments at 87 ms p95 · FinCore</text>
    <rect class="bar" x="30" y="134" width="300" height="4" rx="2" fill="#f89820" style="animation-delay:.4s"/>
  </g>
  <g class="card" style="animation-delay:.3s">
    <rect x="350" y="54" width="300" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
    <text class="big" x="370" y="96" fill="#6db33f">133 → 2,800+</text>
    <text class="lbl" x="370" y="120">Kafka events/s via outbox relay</text>
    <rect class="bar" x="350" y="134" width="300" height="4" rx="2" fill="#6db33f" style="animation-delay:.6s"/>
  </g>
  <g class="card" style="animation-delay:.5s">
    <rect x="670" y="54" width="300" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
    <text class="big" x="690" y="96" fill="#61dafb">6 h → 25 min</text>
    <text class="lbl" x="690" y="120">workflow creation with AI Flow Builder</text>
    <rect class="bar" x="670" y="134" width="300" height="4" rx="2" fill="#61dafb" style="animation-delay:.8s"/>
  </g>

  <g class="card" style="animation-delay:.7s">
    <rect x="30" y="152" width="300" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
    <text class="big" x="50" y="192" fill="#a371f7">211K+</text>
    <text class="lbl" x="50" y="216">payments with a consistent ledger</text>
  </g>
  <g class="card" style="animation-delay:.9s">
    <rect x="350" y="152" width="300" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
    <text class="big" x="370" y="192" fill="#ff7b72">7 🏆</text>
    <text class="lbl" x="370" y="216">hackathons won</text>
  </g>
  <g class="card" style="animation-delay:1.1s">
    <rect x="670" y="152" width="300" height="78" rx="10" fill="#161b22" stroke="#30363d"/>
    <text class="big" x="690" y="192" fill="#e3b341">0</text>
    <text class="lbl" x="690" y="216">overdrafts · 11,885 over-limit blocked</text>
  </g>
</svg>
